[package]
name = "metatidy-server"
version = "0.3.2"
edition = "2021"
rust-version = "1.80"
description = "metatidy Rust 后端：索引优先的音乐元数据工作台"
license = "LicenseRef-Proprietary"

[dependencies]
# HTTP
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "set-header"] }
tokio = { version = "1", features = ["full"] }

# 数据库 / 缓存（一等公民，不是可选补丁）
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
    "json",
    "macros",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# 音频标签：唯一能全格式读写的编译型库
lofty = "0.21"

# 其它
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
walkdir = "2"
rayon = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
once_cell = "1"
regex = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# 容器构建专用 profile：镜像里的瓶颈是 IO 而不是 CPU，
# 但双架构要编译 300 个 crate，release 的 thin-LTO + codegen-units=1
# 会把构建时间推到不可接受（实测让 arm64 跑 QEMU 时一小时都没编完）。
# 关掉 LTO、放开 codegen-units 能显著缩短编译时间，运行开销几乎无感。
[profile.docker]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
