# metatidy 一键部署（Rust 后端 + PostgreSQL + Redis）
#
# 用法：
#   1) 改下面的 volumes 路径，把左侧换成你自己的音乐目录
#   2) 当前镜像公开，可直接拉取；如果自行改为私有，需要先 docker login ghcr.io
#   3) docker compose up -d
#   4) 打开 http://<主机IP>:8080/
#
# 与 Python 版的差别：索引不再放单文件 SQLite，而是 PostgreSQL；后台任务的实时进度在 Redis。
# 这两个依赖都写在下面，不用你另外装。**生产环境请改掉 postgres 的默认密码**（两处要一致）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: metatidy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metatidy
      POSTGRES_PASSWORD: metatidy
      POSTGRES_DB: metatidy
      TZ: Asia/Shanghai
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metatidy"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: metatidy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  metatidy:
    image: ghcr.io/jasonb589/metatidy:latest
    # 想本地构建就把下面这行打开（并把 image 保留为最终产物名）
    # build:
    #   context: .
    #   dockerfile: backend-rs/Dockerfile
    container_name: metatidy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # ── 存储：索引在 Postgres，任务进度在 Redis ──
      DATABASE_URL: postgres://metatidy:metatidy@postgres:5432/metatidy
      REDIS_URL: redis://redis:6379
      # ── 库与缓存 ──
      METATIDY_MUSIC_DIR: /music        # 要扫描/整理的库
      METATIDY_LIBRARY_ROOT: /music     # 整理移动的边界（绝不能越出这里）
      METATIDY_DATA_DIR: /data          # covers 原图缓存；thumbs 按需生成 AVIF 缩略图
      METATIDY_SCAN_WORKERS: "4"        # 机械硬盘建议 2，SSD/NVMe 可 8
      # ── 自动增量扫描：新增/修改音乐自动入库；启动和监听恢复时补扫，不自动清理索引 ──
      METATIDY_AUTO_SCAN: "1"          # 默认开启；设 0 关闭（继续支持手动扫描）
      METATIDY_AUTO_SCAN_FAST: "0"     # 默认读真实标签；云盘首次启动前可设 1，仅按路径建索引
      METATIDY_AUTO_SCAN_DEBOUNCE_SECS: "10" # 静默 10 秒后再检查大小/mtime稳定，减少读取未复制完的文件
      # CloudDrive2/远端网盘改动须传入文件事件；官方App上传后可能需先刷新CD2目录或手动补扫。
      RUST_LOG: info
      # ── 登录保护：**务必改掉**这个占位口令，否则等于把口令写进配置文件 ──
      # 不设这一项 = 界面完全开放（同网段谁都能改你的标签、按模板移动你的文件）
      METATIDY_PASSWORD: "change-me-请改成你自己的口令"
      # 挂了反代（Nginx Proxy Manager / Traefik 等，默认会带 X-Forwarded-For）时打开：
      # 登录失败限速按**真实客户端 IP** 算，而不是所有请求都算在反代那一个 IP 上
      # （不开的话，有人在公网猛试密码会把你自己也锁 5 分钟）。
      # 验证：登录一次，容器日志里的「登录成功：来源 …」应该显示你的真实 IP。
      # **直接把端口暴露出去时不要开** —— 那样谁都能伪造 X-Forwarded-For 绕过限速。
      # METATIDY_TRUST_PROXY: "1"
      TZ: Asia/Shanghai
      # ── 可选密钥：不配也不影响主要功能，只影响对应数据源 ──
      # SPOTIFY_CLIENT_ID: ""
      # SPOTIFY_CLIENT_SECRET: ""
      # GENIUS_TOKEN: ""
      # DISCOGS_TOKEN: ""
      # LASTFM_API_KEY: ""                # 内置的 Last.fm key 已被上游吊销，要用请自备
      # ── 可选：歌手头像同步到 Navidrome >= 0.61.0 ──
      # 在同目录 .env 填写三项，再取消下面注释并重建 metatidy 容器。
      # URL 要从本容器可达；可用同网络服务名或 NAS 地址，并可包含反代路径前缀。
      # EnableArtworkUpload=true 时普通用户可上传；false 时需管理员。
      # 此头像功能无需 LASTFM_API_KEY；该 key 只用于上面的元数据刮削源。
      # METATIDY_NAVIDROME_URL: "${METATIDY_NAVIDROME_URL:-}"
      # METATIDY_NAVIDROME_USERNAME: "${METATIDY_NAVIDROME_USERNAME:-}"
      # METATIDY_NAVIDROME_PASSWORD: "${METATIDY_NAVIDROME_PASSWORD:-}"
    volumes:
      # 需要读写权限：写标签 + 按模板移动文件
      - ./music:/music
      - ./data:/data
    # 如果宿主目录属于某个普通用户，容器内以同一 UID 运行可避免权限问题（Linux 下用）
    # user: "1000:1000"
