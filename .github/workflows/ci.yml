name: CI & Image

# 流程：先跑测试，测试过了才构建镜像；镜像推送到 GHCR。
# 私有仓库的副作用：GHCR 包默认也是私有的，别人拉取需要先 docker login（见 README）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: 离线测试（阻断门禁）
        env:
          METATIDY_OFFLINE: "1"
        run: python -m pytest -q

      - name: 联网测试（含真实数据源，允许失败）
        continue-on-error: true
        run: python -m pytest -q

  rust:
    name: Rust 后端
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metatidy
          POSTGRES_PASSWORD: metatidy
          POSTGRES_DB: metatidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metatidy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-rs
    env:
      DATABASE_URL: postgres://metatidy:metatidy@localhost:5432/metatidy
      REDIS_URL: redis://localhost:6379
      METATIDY_MUSIC_DIR: /tmp/metatidy-music
      METATIDY_LIBRARY_ROOT: /tmp/metatidy-music
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs

      - name: 准备音乐目录
        run: mkdir -p /tmp/metatidy-music

      - name: 生成真实音频样本（ffmpeg，供标签读写测试用）
        run: |
          mkdir -p /tmp/metatidy-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=mono -t 2 \
            -map_metadata -1 -c:a flac -y /tmp/metatidy-fixtures/sample.flac
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=mono -t 2 \
            -map_metadata -1 -c:a libmp3lame -q:a 9 -y /tmp/metatidy-fixtures/sample.mp3
          ls -l /tmp/metatidy-fixtures
          echo "METATIDY_TEST_FLAC=/tmp/metatidy-fixtures/sample.flac" >> "$GITHUB_ENV"
          echo "METATIDY_TEST_MP3=/tmp/metatidy-fixtures/sample.mp3" >> "$GITHUB_ENV"

      - name: 编译
        run: cargo build --release

      - name: 单元测试
        run: cargo test --release

      - name: 依赖自检（真 Postgres + 真 Redis + 真实 HTTP + lofty）
        run: cargo run --release -- --selftest

      - name: 索引层端到端自检（扫描 / 增量 / 标签编辑 / 整理移动 / 快速扫描）
        run: cargo run --release -- --selftest-index

      - name: 冒烟：起服务并断言状态接口
        run: |
          ./target/release/metatidy-server &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          echo "--- /api/status ---"
          cat /tmp/status.json; echo
          grep -q '"postgres":true' /tmp/status.json
          grep -q '"redis":true' /tmp/status.json
          grep -q '"engine":"rust"' /tmp/status.json
          kill $SERVER_PID
          echo "冒烟通过"

      - name: Clippy（暂不阻断，先让骨架过）
        continue-on-error: true
        run: cargo clippy --all-targets

      - name: 格式检查（暂不阻断）
        continue-on-error: true
        run: cargo fmt --check

  build:
    name: 构建并推送镜像
    needs: [test, rust]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建（amd64 + arm64）并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
