name: CI & Image

# 流程：先跑测试，测试过了才构建镜像；镜像推送到 GHCR。
# 私有仓库的副作用：GHCR 包默认也是私有的，别人拉取需要先 docker login（见 README）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: 离线测试（阻断门禁）
        env:
          METATIDY_OFFLINE: "1"
        run: python -m pytest -q

      - name: 联网测试（含真实数据源，允许失败）
        continue-on-error: true
        run: python -m pytest -q

  rust:
    name: Rust 后端
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metatidy
          POSTGRES_PASSWORD: metatidy
          POSTGRES_DB: metatidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metatidy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-rs
    env:
      DATABASE_URL: postgres://metatidy:metatidy@localhost:5432/metatidy
      REDIS_URL: redis://localhost:6379
      METATIDY_MUSIC_DIR: /tmp/metatidy-music
      METATIDY_LIBRARY_ROOT: /tmp/metatidy-music
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装验收脚本依赖（requests + mutagen）
        run: python -m pip install --quiet --disable-pip-version-check requests mutagen

      - name: 准备音乐目录
        run: mkdir -p /tmp/metatidy-music

      # 编译放在样本生成之前：样本生成属于测试的准备工作，
      # 一旦它失败会连带跳过后面所有步骤，导致拿不到编译反馈、白等一整轮 CI。
      - name: 编译
        run: cargo build --release

      - name: 生成真实音频样本（供标签读写测试用）
        # 给这一步硬性超时：apt 镜像偶尔会慢到离谱，不能让它把整条流水线挂住
        timeout-minutes: 8
        run: |
          set -e
          mkdir -p /tmp/metatidy-fixtures
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "runner 上没有 ffmpeg：先试 apt（限时 5 分钟）"
            if ! timeout 300 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg'; then
              echo "apt 路线失败或超时，改下载静态版 ffmpeg"
              curl -fsSL --retry 3 --retry-delay 2 --max-time 300 -o /tmp/ffmpeg.tar.xz \
                https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
              mkdir -p /tmp/ffmpeg-static
              tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
              sudo install -m 0755 /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
            fi
          fi
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=mono -t 2 \
            -map_metadata -1 -c:a flac -y /tmp/metatidy-fixtures/sample.flac
          ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=mono -t 2 \
            -map_metadata -1 -c:a libmp3lame -q:a 9 -y /tmp/metatidy-fixtures/sample.mp3
          ls -l /tmp/metatidy-fixtures
          test -s /tmp/metatidy-fixtures/sample.flac
          test -s /tmp/metatidy-fixtures/sample.mp3
          echo "METATIDY_TEST_FLAC=/tmp/metatidy-fixtures/sample.flac" >> "$GITHUB_ENV"
          echo "METATIDY_TEST_MP3=/tmp/metatidy-fixtures/sample.mp3" >> "$GITHUB_ENV"

      - name: 单元测试
        run: cargo test --release

      - name: 依赖自检（真 Postgres + 真 Redis + 真实 HTTP + lofty）
        run: cargo run --release -- --selftest

      - name: 索引层端到端自检（扫描 / 增量 / 标签编辑 / 整理移动 / 快速扫描）
        run: cargo run --release -- --selftest-index

      # 阶段 3 的唯一端到端证据：真实联网打 4 个源 + 取歌词 + 取封面。
      # 允许重试一次：MusicBrainz 偶发握手失败/503（本机对照实验约 20%，Python 版同样如此）；
      # 真坏了第二次仍会失败，不会把红灯洗白。
      - name: 刮削层自检（真实联网：MusicBrainz / iTunes / 网易云 / Deezer）
        run: |
          for attempt in 1 2; do
            if ./target/release/metatidy-server --selftest-scrape; then exit 0; fi
            echo "第 $attempt 次失败，5 秒后重试"
            sleep 5
          done
          echo "两次都失败"
          exit 1

      # 端到端验收：与 Python 版**同一套 31 项检查**，这次打的是编译出来的 Rust 二进制。
      # E2E_SERVER_CMD 用「相对仓库根」的路径（脚本以仓库根为 cwd 启动服务端），
      # 端口由 METATIDY_PORT 传给服务端（脚本自身固定轮询 8097）。
      # 先清库：验收里断言「索引 5 首」，前面的自检留下的行会让它假红。
      - name: 端到端验收（真实服务 + Postgres + Redis + 真实数据源）
        env:
          METATIDY_PORT: "8097"
          E2E_SERVER_CMD: ./backend-rs/target/release/metatidy-server
        run: |
          psql "$DATABASE_URL" -c 'TRUNCATE tracks, jobs, move_plans, alias_artist, alias_album RESTART IDENTITY;' || true
          python "$GITHUB_WORKSPACE/tests/e2e_acceptance.py" "$GITHUB_WORKSPACE" /tmp/metatidy-e2e

      # 零构建前端没有编译器，语法错误只能等浏览器报错；这里用 runner 自带的 node 兜住。
      # （模块语法按 ESM 检查，所以复制成 .mjs 再 --check）
      - name: 前端语法检查（node --check，零构建前端）
        run: |
          for f in "$GITHUB_WORKSPACE"/app/static/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
          echo "前端 JS 全部通过语法检查"

      - name: 冒烟：起服务并断言状态接口
        run: |
          ./target/release/metatidy-server &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          echo "--- /api/status ---"
          cat /tmp/status.json; echo
          grep -q '"postgres":true' /tmp/status.json
          grep -q '"redis":true' /tmp/status.json
          grep -q '"engine":"rust"' /tmp/status.json
          kill $SERVER_PID
          echo "冒烟通过"

      - name: Clippy（暂不阻断，先让骨架过）
        continue-on-error: true
        run: cargo clippy --all-targets

      - name: 格式检查（暂不阻断）
        continue-on-error: true
        run: cargo fmt --check

  build:
    name: 构建并推送镜像
    # 只依赖 Rust 门禁：Python 版已退役为「契约参考实现」，
    # 它那套会真联网的集成测试抖动时不该挡住镜像发布（那个 job 仍会自己报红）。
    needs: [rust]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # 冒烟要用真 Postgres + 真 Redis（与上面 rust job 同一套配置）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metatidy
          POSTGRES_PASSWORD: metatidy
          POSTGRES_DB: metatidy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metatidy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建（amd64 + arm64）并推送
        uses: docker/build-push-action@v6
        with:
          # 上下文是仓库根：镜像要带无构建前端 app/static；
          # Dockerfile 是 Rust 后端那一份，COPY 路径都写成 backend-rs/...（见该文件注释）
          context: .
          file: backend-rs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 最后一环：把**刚推上去的镜像**拉回来真跑一遍。
      # 前面的 31 项验收打的是宿主机上的二进制；这一步验证的是交付物本身：
      # 镜像能拉、容器能起、接口与首屏都正常（--network host 让容器直连 runner 的
      # service 容器——Linux runner 上没有 host.docker.internal）。
      - name: 冒烟：拉回镜像并真启动（接口 + 静态前端 + 数据库连通）
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA:0:7}"
          echo "使用镜像：$IMG"
          docker pull --platform linux/amd64 "$IMG"
          docker run -d --name metatidy-smoke --network host \
            -e DATABASE_URL="postgres://metatidy:metatidy@127.0.0.1:5432/metatidy" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e METATIDY_MUSIC_DIR=/tmp/libraries \
            -e METATIDY_LIBRARY_ROOT=/tmp/libraries \
            "$IMG"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status -o /tmp/status.json; then break; fi
            sleep 1
          done
          echo "--- /api/status ---"
          cat /tmp/status.json; echo
          grep -q '"engine":"rust"' /tmp/status.json
          grep -q '"postgres":true' /tmp/status.json
          grep -q '"redis":true' /tmp/status.json
          echo "--- 首屏 ---"
          curl -fsS http://127.0.0.1:8080/ -o /tmp/index.html
          grep -qi '<html' /tmp/index.html
          head -c 160 /tmp/index.html; echo
          echo "--- 容器日志尾部 ---"
          docker logs --tail 15 metatidy-smoke || true
          docker rm -f metatidy-smoke
          echo "镜像冒烟通过：能拉、能起、接口与前端都对"
